[platformio]
default_envs = tx_node

[env]
platform = atmelavr
board = pro16MHzatmega328
framework = arduino
lib_deps = nRF24/RF24@^1.4.10
build_flags = -Wall
# Upload por puerto serie via Optiboot a 57600 baud.
upload_protocol = arduino
upload_speed = 57600

[env:tx_node]
build_flags =
  ${env.build_flags}
  -DTX_NODE=1

[env:rx_node]
build_flags =
  ${env.build_flags}
  -DRX_NODE=1
